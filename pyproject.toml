[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-csl"
version = "0.1.0"
description = "Standalone Single-CSL and Inter-CSL reference implementation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "Takafumi Horie"}]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[project.scripts]
legacy-csl = "legacy_csl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
