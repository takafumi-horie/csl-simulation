mode: inter-csl
run:
  name: inter-example
  iterations: 500
  experiments: 1
  seed: 0
paths:
  data_root: ../../datadump
  output_root: ../outputs
word_model:
  rescaling: legacy_theta_sum
  theta_sampler: legacy_importance
  importance_candidates: 10000
attribute_model:
  # Uniform attribute sampling with replacement (duplicates are allowed).
  exclusivity: distinct
interaction: mh
freeze:
  gmm: false
  theta: false
  attributes: false
hyperparameters:
  category_counts:
    a: 10
    p: 10
    o: 10
    c: 10
  vocabulary_size: 13
  word_length: 4
  gamma: 0.1
  # Legacy Gaussian--inverse-Wishart defaults. Each mapping can be tuned
  # independently for action (a), position (p), object (o), and color (c).
  gmm:
    mixture_concentration: {a: 0.1, p: 0.1, o: 0.1, c: 0.1}
    frozen_mixture_concentration: {a: 0.1, p: 0.1, o: 0.1, c: 0.1}
    mean_prior: {a: 0.0, p: 0.0, o: 0.0, c: 0.0}
    mean_precision: {a: 0.001, p: 0.001, o: 0.001, c: 0.001}
    covariance_scale: {a: 0.01, p: 0.01, o: 0.01, c: 0.01}
    covariance_df_offset: {a: 2.0, p: 2.0, o: 2.0, c: 2.0}
    kmeans_n_init: 10
